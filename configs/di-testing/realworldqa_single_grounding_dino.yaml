# RealWorldQA single-tool (GroundingDINO) configuration
agent_config_version: single_tool_grounding_dino_v1_0215
agent_name: BaseAgentWithTools

agent_kwargs:
  base: "http://localhost:8222"
  key: "empty"
  model: "Qwen/Qwen3-VL-8B-Instruct"
  timeout: 600
  custom_prompt: false
  max_tokens: 2048
  temperature: 0.6
  top_p: 0.95
  repetition_penalty: 1.1
  retry: 3
  verbose: true
  tool_base: "http://localhost:8101"
  tool_choice: "auto"
  tool_list:
    - grounding_dino
  prompt_version: "v2"
  reasoning_effort: null
  persistent_state_memory:
    name: "image"
    emit_policy: "always"
  extra_body: {}
  max_iterations: 15
