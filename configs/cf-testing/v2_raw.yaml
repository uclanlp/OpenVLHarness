# V2 agent configuration with raw response saving for SFT/RL training
agent_name: BaseAgentWithToolsV2
agent_config_version: v1_0215

agent_kwargs:
  base: "http://localhost:8222"
  key: "empty"
  model: "Qwen/Qwen3-VL-8B-Instruct"
  timeout: 600
  custom_prompt: false
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.95
  repetition_penalty: 1.1
  retry: 3
  verbose: true
  debug_tool_loop: true
  tool_base: "http://localhost:8101"
  tool_choice: "auto"
  tool_list: ["Crop_Tool", "Visual_Grounding_Tool", "Python_Executor_Tool", "Zoom_In_Tool", "OCR_Tool"]
  prompt_version: "v3"
  reasoning_effort: null
  persistent_state_memory:
    name: "image"
    emit_policy: "always"
  extra_body: {}
  max_iterations: 30
  save_raw_response: true
