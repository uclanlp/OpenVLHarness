# OpenAI GPT-5 as tool-calling orchestrator via the Responses API (/v1/responses).
# APIAgentWithTools inherits from BaseAgentWithToolsAndCode, so
# Python_Coding_Agent_Tool's generated code is still executed locally against
# memory bindings.
agent_name: APIAgentWithTools
agent_config_version: v1_0215

agent_kwargs:
  base: "https://api.openai.com"
  key: "empty"  # loaded from OPENAI_API_KEY (or MODEL_API_KEY) in repo-root .env
  model: "gpt-5-2025-08-07"
  timeout: 600
  custom_prompt: false
  max_tokens: 16000
  reasoning_effort: "low"
  retry: 3
  verbose: true
  extra_body: {}

  tool_base: "http://localhost:8101"
  tool_choice: "auto"
  tool_list:
    - "Visual_Grounding_Tool"
    - "Depth_Estimation_Tool"
    - "OCR_Tool"
    - "Python_Coding_Agent_Tool"
    - "Zoom_In_Tool"
    - "Webpage_Visit_Tool"
    - "Image_Search_Tool"
    - "Text_Search_Tool"
    - "Camera_Trajectory_Tool"
  prompt_version: "openai_v1"
  persistent_state_memory:
    emit_policy: "always"
    modules:
      - name: "image"
      - name: "tool_context"
      - name: "url"
        webpage_env_update_limit: 20
  max_iterations: 15
