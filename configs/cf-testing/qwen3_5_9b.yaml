# Test config for BaseAgentWithToolsAndCode
# Uses the coding agent tool with orchestrator-side code execution.
# The Python_Coding_Agent_Tool generates code on the tool server (LLM-only),
# and the agent executes it locally with actual data bindings from memory.
agent_name: BaseAgentWithToolsAndCode
agent_config_version: v1_0215

agent_kwargs:
  base: "http://localhost:8333"
  key: "empty"
  model: "Qwen/Qwen3.5-9B"
  timeout: 600
  custom_prompt: false
  max_tokens: 2048
  max_context_length: 168000 # set this to your max-model-len of vllm server
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0 # increase this if encounter endless repetitions
  repetition_penalty: 1.0
  retry: 3
  verbose: true
  debug_tool_loop: true
  tool_base: "http://localhost:8101"
  tool_choice: "auto"
  tool_list:
    - "Visual_Grounding_Tool"
    - "Depth_Estimation_Tool"
    - "OCR_Tool"
    - "Python_Coding_Agent_Tool"
    - "Zoom_In_Tool"
  prompt_version: "v2_thinking"
  reasoning_effort: null
  persistent_state_memory:
    name: "tool_context"       # must be tool_context to get descriptor injection
    emit_policy: "always"
  extra_body: {}
  max_iterations: 15
