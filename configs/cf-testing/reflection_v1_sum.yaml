# Reflection / experience-learning configuration
#
# Usage examples:
#
#   Using existing trajectories (trajectory.source: "existing"):
#     python run_experience_learning.py \
#         --reflection-config configs/cf-testing/reflection.yaml
#
#   Running inference on the fly (trajectory.source: "infer"):
#     python run_experience_learning.py \
#         --config configs/base_agent_with_tools.yaml \
#         --reflection-config configs/cf-testing/reflection.yaml \
#         --data RealWorldQA
#
#   With runtime overrides:
#     python run_experience_learning.py \
#         --config configs/base_agent_with_tools.yaml \
#         --reflection-config configs/cf-testing/reflection.yaml \
#         --data RealWorldQA \
#         --num-examples 50 --num-proc 4

# --- Reflector LLM settings ---
reflector:
  model: "Qwen/Qwen3-VL-8B-Instruct"                      # LLM for principle extraction (can differ from agent)
  base_url: "http://localhost:8222/v1/chat/completions"
  api_key: "empty"                        # null → falls back to OPENAI_API_KEY env var
  temperature: 0.7
  max_tokens: 8192
  # extra_body:                    # additional fields merged into the API request payload
  #   logit_bias:
  #     "248069": 8             # adjust reasoning effort (for qwen3.5 9b, see https://www.reddit.com/r/LocalLLaMA/comments/1rehykx/qwen35_low_reasoning_effort_trick_in_llamaserver/)

# --- Learning / reflection settings ---
learning:
  max_tries: 3                         # number of iterative learning trials
  generation_strategy: "instance_summarize"              # "batch" | "instance" | "instance_summarize"
                                       #   batch:              compress all trajectories → 1 reflector call per trial
                                       #   instance:           per-instance reflection, save lesson files (no summary)
                                       #   instance_summarize: per-instance reflection + summarize into principles
  passing_strategy: "experience_file"     # "experience_file" | "instance_critique"
                                       #   experience_file:    inject summarized principles via experience.md
                                       #   instance_critique:  prepend per-instance critique to user message
  skip_correct: true                     # skip correctly-answered instances in subsequent trials
  reflect_on: "failures_only"          # "all" | "failures_only"
  max_examples: 50                     # cap per reflector call; samples if more (batch strategy)
  max_result_chars: 80                 # tool result truncation in compressed digest (batch strategy)
  instance_reflection_prompt: "v1"  # version key (e.g. "v1") or inline prompt with {pruned_trajectory}, {last_response}, {ground_truth}
  summarize_chunk_size: 20 # 0 (or absent) → original single-call behavior, 20 with 100 lessons → 5 chunks, each summarized, then merged into final structured document

# --- Trajectory source & storage ---
trajectory:
  source: "infer"                      # "infer"    → run inference on the fly each trial
                                       # "existing" → use pre-existing trajectories + results
  existing_trajectories_dir: null      # path to full_trajectories/ dir (when source: "existing")
  existing_results_file: null          # path to result file with answers   (when source: "existing")
  save_trajectories: false              # keep full_trajectories/*.json each trial (useful for debugging)

# --- Output ---
output:
  experience_file: "experience.md"     # final output path for the learned principles
  save_all_intermediate: true         # true: keep experience_v1.md, v2.md, ...
                                       # false: overwrite experience_latest.md each trial (batch)
