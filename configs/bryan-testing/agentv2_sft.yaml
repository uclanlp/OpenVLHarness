# Example agent configuration (subset of tools)
agent_name: BaseAgentWithToolsV2
agent_config_version: v2_0422

agent_kwargs:
  base: "http://localhost:8222"
  key: "empty"
  model: "Qwen/Qwen3-VL-8B-Instruct"
  timeout: 600
  custom_prompt: false
  max_tokens: 2048
  temperature: 0.3
  top_p: 0.95
  repetition_penalty: 1.1
  retry: 3
  verbose: true
  debug_tool_loop: true
  tool_base: "http://localhost:8102"
  tool_choice: "auto"  # default: "auto". Can be "none" or {"type":"function","function":{"name":"ToolName"}}
  tool_list: ["Visual_Grounding_Tool", "Depth_Estimation_Tool", "Zoom_In_Tool", "OCR_Tool"]
  # tool_list: ["Visual_Grounding_Tool", "Depth_Estimation_Tool", "Zoom_In_Tool", "OCR_Tool", "Text_Search_Tool", "Image_Search_Tool", "Webpage_Visit_Tool", "Python_Coding_Agent_Tool"]
  prompt_version: "v3"  # default in this config: "v2". Set "v1" to use the original prompt template.
  reasoning_effort: null  # optional OpenAI GPT-5 knob: "minimal" | "low" | "medium" | "high"
  persistent_state_memory:  # default: {"name": "image", "emit_policy": "always"}
    name: "image"
    emit_policy: "always"  # "always" (default) or "on_change"
  extra_body: {}  # optional provider-specific fields forwarded to chat/completions
  max_iterations: 15
  save_raw_response: true
