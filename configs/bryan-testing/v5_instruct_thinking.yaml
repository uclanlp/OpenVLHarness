# Test config for BaseAgentWithToolsAndCode on Qwen3-VL-8B-Thinking
# Uses the refactored composable memory stack with all current modules:
# - ImageModule
# - ToolContextModule
# - UrlModule
# The Python_Coding_Agent_Tool generates code on the tool server (LLM-only),
# and the agent executes it locally with actual data bindings from memory.
agent_name: BaseAgentWithToolsAndCode
agent_config_version: v1_0215

agent_kwargs:
  base: "http://localhost:8222"
  key: "empty"
  model: "Qwen/Qwen3-VL-8B-Thinking"
  timeout: 1800
  custom_prompt: false
  max_tokens: 200000
  max_context_length: 260000 # set this to your max-model-len of vllm server
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 0.0
  return_token_ids: true # vLLM-only: include token ids in response for SFT training
  retry: 3
  verbose: true
  # debug_tool_loop: true
  tool_base: "http://localhost:8102"
  tool_choice: "auto"
  tool_list:
    - "Visual_Grounding_Tool"
    - "Depth_Estimation_Tool"
    - "OCR_Tool"
    - "Python_Coding_Agent_Tool"
    - "Zoom_In_Tool"
    - "Webpage_Visit_Tool"
    - "Image_Search_Tool"
    - "Text_Search_Tool"
  prompt_version: "v2_thinking"
  reasoning_effort: null
  persistent_state_memory:
    emit_policy: "always"      # emit Environment Update every turn with successful tool outputs
    modules:
      - name: "image"
      - name: "tool_context"
      - name: "url"
        webpage_env_update_limit: 20
  max_iterations: 15
