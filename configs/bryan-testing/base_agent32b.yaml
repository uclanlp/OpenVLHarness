# Example agent configuration
agent_name: BaseAgent
agent_config_version: v1_0215

agent_kwargs:
  base: "http://localhost:8222"
  key: "empty"
  model: "Qwen/Qwen3-VL-32B-Instruct"
  timeout: 600
  custom_prompt: false
  max_tokens: 12800
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0
  retry: 3
  verbose: true
  # Optional provider-specific fields:
  # extra_body: {}
  # BaseAgentWithTools only:
  # tool_choice: "auto"
  # tool_list: null  # default: null (use all tools). Example subset: ["Python_Executor_Tool", "Visual_Grounding_Tool"]
  # prompt_version: "v1"  # optional: "v1" or "v2"
  # reasoning_effort: "medium"  # optional OpenAI GPT-5 knob
  # runtime_environment_hooks: ["image"]  # default: ["image"], disable with [] or "off"/"disabled"
  # runtime_environment_emit_policy: "always"  # "always" (default) or "on_change"
