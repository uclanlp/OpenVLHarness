hydra:
  # Import base PPO config set from upstream verl.
  # Use an absolute searchpath so Hydra resolves correctly regardless of CWD.
  # The run script may also override this via hydra.searchpath on the CLI.
  searchpath:
    - file:///data/<user>/mini-vlm-toolkit/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 4096
  max_response_length: 2048
  train_batch_size: 128
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: error
  prompt_key: prompt
  image_key: images

algorithm:
  adv_estimator: grpo

reward:
  custom_reward_function:
    path: rl/rewards/compute_score.py
    name: compute_score

actor_rollout_ref:
  hybrid_engine: True
  model:
    use_remove_padding: True
    enable_gradient_checkpointing: True
    override_config:
      attn_implementation: sdpa
  actor:
    use_dynamic_bsz: True
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
  rollout:
    name: vllm
    mode: async
    over_sample_rate: 0.1
    gpu_memory_utilization: 0.25
    enforce_eager: True
    max_num_batched_tokens: 2048
    max_num_seqs: 64
    checkpoint_engine:
      update_weights_bucket_megabytes: 2560
    # Qwen3-VL defaults to 262144 context which OOMs vLLM KV cache.
    # prompt(4096) + response(2048) × multi-turn(10) ≈ 24K; 32K gives headroom.
    max_model_len: 8192
    # GRPO requires multiple rollouts per prompt to compute group-relative advantages.
    n: 8
    # Must match the number of GPUs available; default upstream is 2 which breaks 1-GPU runs.
    tensor_model_parallel_size: 1
    multi_turn:
      enable: True
      format: hermes
      max_assistant_turns: 10
      max_user_turns: 10
      max_parallel_calls: 1
      max_tool_response_length: 256
      tokenization_sanity_check_mode: strict
      tool_config_path: rl/configs/tool_config.yaml
    agent:
      num_workers: 1

trainer:
  project_name: visual-tooluse-grpo
  experiment_name: qwen3vl_grpo
  logger: ["console", "wandb"]
  balance_batch: False
  total_epochs: 3
  save_freq: 50
  test_freq: 50
  val_before_train: False
  nnodes: 1
  n_gpus_per_node: 1
