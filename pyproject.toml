[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvlharness"
version = "0.1.0"
description = "A visual tool agent with persistent per-question memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28", "PyYAML>=6", "numpy>=1.24", "Pillow>=9", "jsonschema>=4"]

[project.scripts]
openvlharness-eval = "openvlharness_eval.cli:main"

[project.urls]
Homepage = "https://openvlharness.github.io/"
Datasets = "https://huggingface.co/datasets/uclanlp/OpenVLHarness-Evaluation-Datasets"

[project.optional-dependencies]
server = ["fastapi>=0.100", "pydantic>=2", "uvicorn>=0.23", "openai>=1.66", "python-dotenv>=1", "boto3>=1.28", "beautifulsoup4>=4", "matplotlib>=3.7"]
qwen = ["transformers>=4.57"]
test = ["pytest>=8", "httpx>=0.24"]
eval = [
    "pandas>=2.1,<3", "numpy>=1.26", "Pillow>=10", "pillow-avif-plugin>=1.4", "tqdm>=4.66",
    "PyYAML>=6", "requests>=2.31", "python-dotenv>=1", "xlsxwriter>=3.1", "openpyxl>=3.1",
    "datasets>=4,<5", "huggingface_hub>=0.25,<2", "filelock>=3", "pycocotools>=2.0", "lvis>=0.5",
    "matplotlib>=3.8", "tabulate>=0.9", "sty>=1.0", "portalocker>=2", "validators>=0.22", "packaging",
    "nltk>=3.8", "rouge>=1.0", "num2words>=0.5", "tiktoken>=0.7", "openai>=1.66",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openvlharness*"]

[tool.setuptools.package-data]
openvlharness_eval = ["dataset/**/*.json", "dataset/**/*.txt", "dataset/**/*.md", "dataset/**/*.js", "dataset/**/*.css"]
openvlharness = ["prompts/*.txt", "services/model_registry.yaml", "services/LICENSE*", "services/tools/**/*.md", "services/tools/**/*.sh", "services/tools/**/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
