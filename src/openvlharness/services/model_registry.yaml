# Exact registered profiles. Provider behavior is explicit, not inferred by prefix.
profiles:
  qwen3-vl-8b-instruct:
    model_id: Qwen/Qwen3-VL-8B-Instruct
    prompt_bundle: v8_instruct
    adapter: chat_completions
    final_answer: answer_tag
    context_policy: qwen_tokenizer
    extra_final_request: true
    continue_empty_answer: true
    append_final_message: false
    context_error_fallback: true
    allowed_options: [max_tokens, temperature, top_p, top_k,
      repetition_penalty, presence_penalty, return_token_ids]
  gpt-6-luna:
    model_id: gpt-6-luna
    prompt_bundle: openai_v1
    adapter: responses
    final_answer: answer_tag_or_text
    context_policy: provider_enforced
    extra_final_request: false
    continue_empty_answer: false
    append_final_message: true
    context_error_fallback: false
    allowed_options: [max_tokens, reasoning_effort]
