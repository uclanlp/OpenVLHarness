### LlamaFactory SFT Config — Qwen3-VL-8B LoRA (example template)
###
### This is a TEMPLATE shipped with the repo. On the first run of
### `bash sft/scripts/run_sft.sh`, a copy will be auto-created at
### `sft/configs/sft_lora_qwen3vl_8b.yaml` for you to customize.
### Edit that copy (not this template) to set hyperparameters,
### dataset name, output dir, etc.
###
### Usage (after the copy is created):
###   bash sft/scripts/run_sft.sh sft/configs/sft_lora_qwen3vl_8b.yaml

### Model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
lora_alpha: 16
lora_dropout: 0.05

### Dataset
### Replace `your_dataset_name` with an entry registered in
### `sft/data/dataset_info.json` (auto-created from `dataset_info_example.json`).
dataset_dir: sft/data
dataset: your_dataset_name
template: qwen3_vl
cutoff_len: 4096
preprocessing_num_workers: 8
overwrite_cache: true

### Output
output_dir: sft/saves/qwen3vl-8b-lora
logging_steps: 10
save_steps: 500
save_total_limit: 3
overwrite_output_dir: true

### Training
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Eval (optional, uncomment to enable)
# val_size: 0.05
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500

### Reporting
report_to: none
# report_to: wandb
# run_name: qwen3vl-8b-lora-sft
