### LlamaFactory SFT Config — Qwen3-VL-8B Full Fine-Tuning (example template)
###
### This is a TEMPLATE shipped with the repo. On the first run of
### `bash sft/scripts/run_sft.sh sft/configs/sft_full_qwen3vl_8b.yaml`,
### a copy will be auto-created at `sft/configs/sft_full_qwen3vl_8b.yaml`
### for you to customize.
###
### Usage (after the copy is created):
###   bash sft/scripts/run_sft.sh sft/configs/sft_full_qwen3vl_8b.yaml

### Model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: full

### Dataset
### Replace `your_dataset_name` with an entry registered in
### `sft/data/dataset_info.json` (auto-created from `dataset_info_example.json`).
dataset_dir: sft/data
dataset: your_dataset_name
template: qwen3_vl
cutoff_len: 4096
preprocessing_num_workers: 8
overwrite_cache: true

### Output
output_dir: sft/saves/qwen3vl-8b-full
logging_steps: 10
save_steps: 500
save_total_limit: 3
overwrite_output_dir: true

### Training
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### DeepSpeed (recommended for full fine-tuning on multi-GPU)
# deepspeed: sft/configs/deepspeed/ds_z3_config.json

### Reporting
report_to: none
