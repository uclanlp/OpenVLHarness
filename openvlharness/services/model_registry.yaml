# Exact registered profiles. Provider behavior is explicit, not inferred by prefix.
# Families share a template through YAML merge keys; every alias still resolves to a
# complete profile, and its model_id is the exact name sent to the server.
templates:
  qwen3_vl_instruct: &qwen3_vl_instruct
    prompt_bundle: v8_instruct
    adapter: chat_completions
    final_answer: answer_tag
    context_policy: qwen_tokenizer
    extra_final_request: true
    continue_empty_answer: true
    append_final_message: false
    context_error_fallback: true
    allowed_options: [max_tokens, temperature, top_p, top_k,
      repetition_penalty, presence_penalty, return_token_ids]
  openai_responses: &openai_responses
    prompt_bundle: openai_v1
    adapter: responses
    final_answer: answer_tag_or_text
    context_policy: provider_enforced
    extra_final_request: false
    continue_empty_answer: false
    append_final_message: true
    context_error_fallback: false
    allowed_options: [max_tokens, reasoning_effort, service_tier]

profiles:
  # Qwen3-VL Instruct models served with vLLM (hermes tool parser). Raw trace export
  # is registered for the 8B model only.
  qwen3-vl-8b-instruct:
    <<: *qwen3_vl_instruct
    model_id: Qwen/Qwen3-VL-8B-Instruct
    raw_trace_format: qwen_chatml
    raw_trace_tokenizer_revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  qwen3-vl-8b-instruct-fp8:
    <<: *qwen3_vl_instruct
    model_id: Qwen/Qwen3-VL-8B-Instruct-FP8
  qwen3-vl-2b-instruct:
    <<: *qwen3_vl_instruct
    model_id: Qwen/Qwen3-VL-2B-Instruct
  qwen3-vl-2b-instruct-fp8:
    <<: *qwen3_vl_instruct
    model_id: Qwen/Qwen3-VL-2B-Instruct-FP8
  qwen3-vl-4b-instruct:
