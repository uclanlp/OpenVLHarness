    model_id: Qwen/Qwen3-VL-4B-Instruct-FP8
  qwen3-vl-32b-instruct:
    <<: *qwen3_vl_instruct
    model_id: Qwen/Qwen3-VL-32B-Instruct
  qwen3-vl-32b-instruct-fp8:
