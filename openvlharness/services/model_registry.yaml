  # Kimi K3 through an OpenAI-compatible Chat Completions endpoint. Tool calls work
  # with the openai_v1 prompt bundle; the endpoint rejects vLLM-only options.
  kimi-k3:
    model_id: kimi-k3
    prompt_bundle: openai_v1
    adapter: chat_completions
    final_answer: answer_tag
    context_policy: provider_enforced
    extra_final_request: true
    continue_empty_answer: true
    append_final_message: false
    context_error_fallback: true
    allowed_options: [max_tokens, temperature, top_p, reasoning_effort]
