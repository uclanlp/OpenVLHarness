# Minimal conda environment for the SAM3 raw server: Python, pip and git only.
# After activation, run install.sh from this directory to install the raw server.
# Tested with Python 3.10.14; see ../README.md for tested versions and limits.
name: openvlharness-sam3
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - git
